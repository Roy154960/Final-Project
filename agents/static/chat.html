<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Multi-Agent RAG Chat</title>
<style>
  :root {
    --bg: #1b1b1f;
    --panel: #232329;
    --border: #33333b;
    --text: #e8e8ec;
    --muted: #9a9aa5;
    --accent: #7c8cff;
    --user-bubble: #3a3a68;
    --ai-bubble: #2a2a31;
    --refused: #5a2b2b;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .thread { font-size: 12px; color: var(--muted); font-family: monospace; }
  header button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  header button:hover { border-color: var(--accent); color: var(--text); }
  #usageBadge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: monospace;
    font-size: 11px;
    margin-right: auto;
    margin-left: 20px;
  }
  #usageBadge .usage-label { color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  #usageBadge .usage-pill {
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 999px;
    padding: 2px 8px;
    white-space: nowrap;
  }
  #usageBadge .usage-pill.low { border-color: var(--danger); color: var(--danger); }
  #usageBadge .usage-pill.fallback { border-color: var(--accent); color: var(--accent); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }
  .row { display: flex; flex-direction: column; max-width: 78%; }
  .row.user { align-self: flex-end; align-items: flex-end; }
  .row.ai { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 14.5px;
  }
  .row.user .bubble { background: var(--user-bubble); border-bottom-right-radius: 3px; }
  .row.ai .bubble { background: var(--ai-bubble); border-bottom-left-radius: 3px; }
  .row.ai .bubble.refused { background: var(--refused); }
  .tag {
    font-size: 11px;
    color: var(--muted);
    margin: 3px 6px;
    font-family: monospace;
  }
  .trace {
    font-size: 11px;
    color: var(--muted);
    margin: 2px 6px 0;
    font-family: monospace;
  }
  #status {
    font-size: 12.5px;
    color: var(--muted);
    padding: 0 20px 6px;
    max-width: 820px;
    margin: 0 auto;
    width: 100%;
  }
  #status.error { color: var(--danger); }

  form#composer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }
  #input {
    flex: 1;
    resize: none;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14.5px;
    font-family: inherit;
    max-height: 140px;
  }
  #input:focus { outline: none; border-color: var(--accent); }
  #send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
  .typing { color: var(--muted); font-size: 13px; font-style: italic; }
  .bubble img.chat-image {
    display: block;
    max-width: 100%;
    max-height: 360px;
    border-radius: 8px;
    margin: 6px 0;
  }
  .bubble a { color: var(--accent); }
</style>
</head>
<body>

<header>
  <div>
    <h1>Multi-Agent RAG Chat</h1>
    <div class="thread" id="threadLabel">thread: (new)</div>
  </div>
  <div id="usageBadge"><span class="usage-label">groq</span></div>
  <button id="newChatBtn" type="button">New conversation</button>
</header>

<div id="messages"></div>
<div id="status"></div>

<form id="composer">
  <textarea id="input" rows="1" placeholder="Ask about the corpus..." autofocus></textarea>
  <button id="send" type="submit">Send</button>
</form>

<script>
const messagesEl = document.getElementById("messages");
const statusEl = document.getElementById("status");
const threadLabelEl = document.getElementById("threadLabel");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const form = document.getElementById("composer");
const newChatBtn = document.getElementById("newChatBtn");

const STORAGE_KEY = "magrag_thread_id";
let threadId = localStorage.getItem(STORAGE_KEY) || null;
let busy = false;

// Groq free-tier usage badge (GET /v1/usage -- see agents/api.py's own
// docstring on that endpoint for why this is the ONLY usage number
// surfaced to this UI; cost/trace logs stay dev-only, on disk). Same
// three models agents/llm_provider.py and local_rag/config.py actually
// use -- update here if those ever change.
const USAGE_POLL_INTERVAL_MS = 15000;
const USAGE_MODELS = [
  { id: "llama-3.3-70b-versatile", label: "large" },
  { id: "llama-3.1-8b-instant", label: "small" },
  { id: "qwen/qwen3.6-27b", label: "vision" },
];
const usageBadgeEl = document.getElementById("usageBadge");

async function pollUsage() {
  try {
    const res = await fetch("/v1/usage");
    if (!res.ok) return;
    const data = await res.json();
    const models = data.models || {};
    usageBadgeEl.innerHTML = '<span class="usage-label">groq</span>';
    for (const { id, label } of USAGE_MODELS) {
      const usage = models[id];
      const pill = document.createElement("span");
      pill.className = "usage-pill";
      if (usage && usage.rpd_remaining !== undefined && usage.rpd_limit) {
        const fraction = Number(usage.rpd_remaining) / Number(usage.rpd_limit);
        if (!Number.isNaN(fraction) && fraction < 0.1) pill.classList.add("low");
        if (usage.backend_status === "fallback_to_local") pill.classList.add("fallback");
        const fallbackNote = usage.backend_status === "fallback_to_local" ? " (local)" : "";
        pill.textContent = `${label}: ${usage.rpd_remaining}/${usage.rpd_limit}${fallbackNote}`;
      } else {
        pill.textContent = `${label}: —`;
      }
      usageBadgeEl.appendChild(pill);
    }
  } catch (err) {
    // Fail quiet -- an unreachable /v1/usage (older server build, brief
    // restart) shouldn't put an error message in the header of an
    // otherwise-working chat.
  }
}

function setStatus(text, isError) {
  statusEl.textContent = text || "";
  statusEl.className = isError ? "error" : "";
}

function updateThreadLabel() {
  threadLabelEl.textContent = "thread: " + (threadId ? threadId.slice(0, 8) : "(new)");
}

function escapeHtml(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// Deliberately NOT a general markdown parser. Agent answers in this
// project only ever use three constructs worth rendering: image_qa's
// `![caption](url)` + `*caption*` line, and painting_lookup's
// `[title](url)` source links -- everything else stays plain escaped
// text. Text is escaped FIRST, then these three patterns are matched
// against the already-escaped string, so nothing in a chunk's text or a
// model's own output can inject arbitrary HTML through this path.
function renderMarkdownLite(text) {
  const escaped = escapeHtml(text);

  let html = escaped.replace(
    /!\[([^\]]*)\]\(([^)\s]+)\)/g,
    (_, alt, url) => `<img src="${url}" alt="${alt}" class="chat-image" loading="lazy">`
  );

  html = html.replace(
    /\[([^\]]+)\]\(([^)\s]+)\)/g,
    (_, label, url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`
  );

  // A whole line wrapped in *asterisks* (image_qa's own caption line).
  html = html.replace(/^\*(.+)\*$/gm, "<em>$1</em>");

  return html;
}

function addRow(role, text, name, traceLine) {
  const row = document.createElement("div");
  row.className = "row " + (role === "human" ? "user" : "ai");

  if (role !== "human" && name) {
    const tag = document.createElement("div");
    tag.className = "tag";
    tag.textContent = name;
    row.appendChild(tag);
  }

  const bubble = document.createElement("div");
  bubble.className = "bubble" + (name === "input_guard" ? " refused" : "");
  if (role === "human") {
    bubble.textContent = text;
  } else {
    bubble.innerHTML = renderMarkdownLite(text);
  }
  row.appendChild(bubble);

  if (traceLine) {
    const trace = document.createElement("div");
    trace.className = "trace";
    trace.textContent = traceLine;
    row.appendChild(trace);
  }

  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return row;
}

async function loadHistory() {
  messagesEl.innerHTML = "";
  if (!threadId) return;
  try {
    const res = await fetch(`/chat/${threadId}/history`);
    if (!res.ok) throw new Error(`history fetch failed: ${res.status}`);
    const data = await res.json();
    for (const m of data.messages) {
      addRow(m.role, m.content, m.name || undefined);
    }
  } catch (err) {
    setStatus("Couldn't load history: " + err.message, true);
  }
}

function startNewConversation() {
  threadId = null;
  localStorage.removeItem(STORAGE_KEY);
  updateThreadLabel();
  messagesEl.innerHTML = "";
  setStatus("");
  inputEl.focus();
}

newChatBtn.addEventListener("click", startNewConversation);

inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
});

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text || busy) return;

  busy = true;
  sendBtn.disabled = true;
  addRow("human", text);
  inputEl.value = "";
  inputEl.style.height = "auto";
  setStatus("");

  const typingRow = document.createElement("div");
  typingRow.className = "row ai";
  typingRow.innerHTML = '<div class="typing">thinking…</div>';
  messagesEl.appendChild(typingRow);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, thread_id: threadId }),
    });
    typingRow.remove();

    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      throw new Error(errBody.detail || `request failed: ${res.status}`);
    }

    const data = await res.json();
    threadId = data.thread_id;
    localStorage.setItem(STORAGE_KEY, threadId);
    updateThreadLabel();

    const trace = data.turn_messages && data.turn_messages.length > 1
      ? "route: " + data.turn_messages.map(m => m.name || "?").join(" -> ")
      : null;
    addRow("ai", data.answer, data.answered_by, trace);

    if (data.blocked) {
      setStatus("Input guard blocked this turn.", true);
    }
  } catch (err) {
    typingRow.remove();
    setStatus("Error: " + err.message, true);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
});

updateThreadLabel();
loadHistory();
pollUsage();
setInterval(pollUsage, USAGE_POLL_INTERVAL_MS);
</script>

</body>
</html>
