# Reverse proxy + static SPA server for the InMind frontend container.
#
# Two jobs, replacing what plain `serve` used to do (see
# docker/frontend.Dockerfile's own comment on why nginx replaced it):
#
#   1. Serve the built React app's static files, with SPA fallback --
#      any request that isn't a real file on disk resolves to
#      index.html instead of a 404, so client-side routes survive a
#      hard refresh or a deep link.
#   2. Proxy everything under /api/ to the backend container over
#      private-net, INTERNALLY -- this is the piece that lets backend's
#      own port stay unpublished to the host entirely (see
#      docker-compose.yml's public-net/private-net split). The browser
#      only ever talks to this one origin now.
#
# proxy_pass's trailing slash on the backend URL is what strips the
# "/api" prefix before forwarding -- frontend/src/api.ts's own routes
# (/chat, /chats, /tools, /v1/usage, ...) match backend's real FastAPI
# routes (agents/api.py) exactly once that prefix is gone. Confirmed
# against agents/api.py directly: none of its own routes carry an /api
# prefix themselves, so this rewrite is required, not cosmetic.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Multi-agent turns can genuinely take a while -- retrieval,
        # possible reranking, synthesis, and this project's own
        # degenerate-answer retry logic (agents/specialists.py) can
        # chain several LLM calls into one /chat response. nginx's 60s
        # default proxy_read_timeout is too tight for that. Not a
        # streaming concern -- confirmed agents/api.py's /chat routes
        # return a single ChatResponse, not text/event-stream -- just a
        # plain "give it enough time" bump.
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # /chat/{thread_id}/upload accepts images/PDFs -- nginx's 1MB
        # default body-size cap would silently reject most of those.
        client_max_body_size 25m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
