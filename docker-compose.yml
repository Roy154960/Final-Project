services:
  chroma-server:
    build:
      context: .
      dockerfile: docker/chroma_server.Dockerfile
    container_name: inmind-chroma-server
    networks:
      - private-net
    volumes:
      - chroma-data:/chroma/data
    ports:
      - "${CHROMA_SERVER_PORT:-8000}:8000"
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      dockerfile: docker/mcp_server.Dockerfile
    container_name: inmind-mcp-server
    networks:
      - private-net
    environment:
      MCP_TRANSPORT: http
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: "8765"
      CHROMA_CLIENT_MODE: http
      CHROMA_SERVER_HOST: chroma-server
      CHROMA_SERVER_PORT: "8000"
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}

      GROQ_API_KEY: ${GROQ_API_KEY:-}

      FRAMING_AGENT_URL: http://framing-agent:8090
    extra_hosts:

      - "host.docker.internal:host-gateway"
    volumes:

      - backend-rag-data:/app/local_rag/data

      - hf-cache:/app/.cache/huggingface

    depends_on:
      chroma-server:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: inmind-backend

    networks:
      - public-net
      - private-net
    environment:
      AGENT_API_HOST: 0.0.0.0
      AGENT_API_PORT: "8001"
      AGENT_API_CORS_ORIGINS: ${AGENT_API_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      AGENT_API_DB_PATH: /app/data/chat_history.sqlite3
      MCP_TRANSPORT: http
      MCP_SERVER_URL: http://mcp-server:8765
      CHROMA_CLIENT_MODE: http
      CHROMA_SERVER_HOST: chroma-server
      CHROMA_SERVER_PORT: "8000"
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}

      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-data:/app/data
      - backend-rag-data:/app/local_rag/data
      - hf-cache:/app/.cache/huggingface

    depends_on:
      chroma-server:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:

        VITE_API_BASE_URL: /api
    container_name: inmind-frontend
    networks:
      - public-net
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:

        condition: service_healthy
    restart: unless-stopped

  framing-agent:
    build:
      context: .
      dockerfile: docker/framing_agent.Dockerfile
    container_name: inmind-framing-agent
    networks:
      - private-net
    environment:
      PORT: "8090"

      GROQ_API_KEY: ${GROQ_API_KEY:-}
      FRAMING_AGENT_GROQ_MODEL: ${FRAMING_AGENT_GROQ_MODEL:-}
      FRAMING_AGENT_OLLAMA_MODEL: ${FRAMING_AGENT_OLLAMA_MODEL:-}

      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:

      - "host.docker.internal:host-gateway"

    restart: unless-stopped

networks:
  public-net:
    driver: bridge
  private-net:
    driver: bridge

volumes:
  chroma-data:

  backend-data:
  backend-rag-data:
  hf-cache:
